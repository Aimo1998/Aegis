# Codemagic 备用构建配置（GitHub Actions 排不到 macOS 时用这个）
# 用法：https://codemagic.io 注册 → 连 GitHub → 选 Aegis 仓库 → 自动识别此文件 → Start build
workflows:
  aegis-unsigned-ipa:
    name: Aegis unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: Aegis
        XCODE_PROJECT: Aegis.xcodeproj
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen || true
      - name: Generate Xcode project
        script: |
          xcodegen generate
          ls -la
      - name: Build unsigned
        script: |
          set -o pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build
      - name: Package IPA
        script: |
          APP="build/Build/Products/Release-iphoneos/Aegis.app"
          ls -la "$APP" || exit 1
          rm -rf Payload Aegis.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Aegis.ipa Payload
          ls -lh Aegis.ipa
    artifacts:
      - Aegis.ipa
