name: Aegis
options:
  bundleIdPrefix: com.aegis
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    # 关闭严格并发检查，避免 Swift 5.9 对 DispatchQueue 场景报错
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Aegis:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Aegis
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aegis.detector
        PRODUCT_NAME: Aegis
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Aegis/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Aegis/Aegis-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Aegis
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.2.2"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        # 未签名构建：CI 与本地自用都不需要证书
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        # 链接 DeviceCheck（A5 App Attest）
        OTHER_LDFLAGS:
          - "-framework"
          - "DeviceCheck"
          - "-framework"
          - "LocalAuthentication"
